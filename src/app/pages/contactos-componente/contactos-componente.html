<div class="flex-col d-flex p20">
    <div id="list-top" class="d-flex ">
        <span class="w30">Nombre</span>
        <span class="w15">Telefono</span>
        <span class="w30">Email</span>
        <span class="w10">Grupos</span>
        <span class="w15">Acciones</span>
    </div>
    
    <ul>
        @for (contact of contactsService.contacts; track $index) {
            <app-contact-list-item [contact]="contact"></app-contact-list-item>
        }
        
    </ul>
    <a routerLink="/contactos/new">+</a>
</div>
