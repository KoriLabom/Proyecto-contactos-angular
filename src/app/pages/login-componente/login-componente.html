<div class="log-in">
    <form (ngSubmit)="login(logInForm.value)" #logInForm="ngForm">
        <input type="text" name="email" id="email" ngModel required="true" maxlength="50">
        <input type="password" name="password" id="password" ngModel required="true" minlength="6">
        <button>Log in</button>
    </form>
</div>
